server:
  port: ${SERVER_PORT:17080}
  servlet:
    context-path: /

spring:
  application:
    name: rd-platform
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产环境用环境变量覆盖，勿使用下列开发默认值
    url: ${DB_URL:jdbc:mysql://api-dev.jq-industries.com:3306/rd_platform?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:qhlk@2017}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # 启动自动建表与种子数据: schema.sql 全部 CREATE TABLE IF NOT EXISTS,
  # data.sql 全部 INSERT IGNORE, 均幂等 —— 首次建表灌数据, 之后启动自动跳过。
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      encoding: utf-8
      continue-on-error: false

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true

jwt:
  # 生产必须用环境变量覆盖：泄露即可伪造任意用户身份（≥32 字节随机串）
  secret: ${JWT_SECRET:TaiYiRdPlatformSecretKey2026ForJwtTokenGeneration}
  expiration: ${JWT_EXPIRATION:7200000}

minio:
  endpoint: ${MINIO_ENDPOINT:http://api-dev.jq-industries.com:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:rd-platform}

logging:
  level:
    # 需要排查 SQL 时，临时把 LOG_LEVEL 设为 DEBUG 并在 mybatis-plus.configuration 加回
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    com.rd.platform: ${LOG_LEVEL:INFO}
    com.baomidou.mybatisplus: ${SQL_LOG_LEVEL:INFO}

# 跨域白名单：生产用 CORS_ALLOWED_ORIGINS 收敛到具体域名（逗号分隔），勿用默认 "*"
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

